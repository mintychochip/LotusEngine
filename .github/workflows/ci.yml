name: CI

on:
  push:
    branches: [main, master, game-allocators]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config \
            libvulkan1 mesa-vulkan-drivers \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev \
            xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        env:
          # mesa-vulkan-drivers gives this job a software Vulkan device
          # (lavapipe), so a missing one is a failure, not a quiet skip of
          # every GPU test.
          LOTUS_REQUIRE_VULKAN: "1"
        run: xvfb-run -a ctest --output-on-failure
